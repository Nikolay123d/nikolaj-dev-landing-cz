<!doctype html>
<html lang="cs" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Web je dočasně aktualizován</title>
  <meta name="description" content="Web je dočasně uzavřen kvůli aktualizaci.">
  <meta property="og:title" content="Aktualizace webu bude otevřena">
  <meta property="og:description" content="Otevřeme již 1. srpna.">
  <meta property="og:image" content="assets/images/maintenance/site-update-cz.jpg">
  <style>
    html {
      min-height: 100%;
      background: #061426;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #061426;
    }

    .maintenance-screen {
      width: 100vw;
      height: 100svh;
      display: grid;
      place-items: center;
      background: #061426;
    }

    .maintenance-screen__image {
      display: block;
      width: 100vw;
      height: 100svh;
      object-fit: contain;
      object-position: center;
      background: #061426;
    }
  </style>
</head>
<body>
  <main class="maintenance-screen" aria-label="Web je dočasně aktualizován">
    <img
      class="maintenance-screen__image"
      src="assets/images/maintenance/site-update-cz.jpg"
      alt="Aktualizace webu bude otevřena 1. srpna"
      width="1024"
      height="1280"
      fetchpriority="high"
      decoding="async"
    >
  </main>
</body>
</html>
